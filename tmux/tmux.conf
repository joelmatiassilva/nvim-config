set -g mouse on

# Permite que tmux use el portapapeles del sistema
set -s set-clipboard on

# Copia al soltar el clic, pero se queda en la misma línea
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -selection clipboard -i"

# Aumenta el historial a 50,000 líneas
set -g history-limit 50000

# Evita que se renombre la ventana automáticamente
set-option -g allow-rename off

set -s escape-time 0

set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Usar teclas de Vim para copiar
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

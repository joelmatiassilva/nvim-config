# ════════════════════════════════════════════════════════════════════════════
#  tmux — pensado para usarse junto con Neovim (ver ../nvim/init.lua)
#  Requiere tmux 3.2 o superior.
# ════════════════════════════════════════════════════════════════════════════

# ── Básico ──────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000    # 50.000 líneas de historial por panel
set -g allow-rename off       # las ventanas conservan el nombre que les pongas
set -s escape-time 0          # sin demora al pulsar Esc
set -g focus-events on        # Neovim recarga los archivos al volver al panel

# ── Terminal: color real y subrayados ───────────────────────────────────────
# tmux-256color es el correcto; si la máquina no lo conoce, se usa screen-256color.
if-shell 'infocmp tmux-256color' { set -g default-terminal 'tmux-256color' } { set -g default-terminal 'screen-256color' }
set -as terminal-features ',xterm-256color:RGB:usstyle'

# ── Portapapeles del sistema ────────────────────────────────────────────────
# set-clipboard copia a través del terminal (OSC 52), también por SSH.
# Además se usa el programa del sistema si existe: gana la última línea que coincida.
set -s set-clipboard on
if-shell '[ -n "$DISPLAY" ] && command -v xclip'           { set -s copy-command 'xclip -selection clipboard -i' }
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy' { set -s copy-command 'wl-copy' }
if-shell 'command -v pbcopy'                               { set -s copy-command 'pbcopy' }
# En WSL, clip.exe a secas rompe los acentos: necesita UTF-16.
if-shell 'command -v clip.exe && command -v iconv'         { set -s copy-command 'iconv -f utf-8 -t utf-16le | clip.exe' }
if-shell 'command -v win32yank.exe'                        { set -s copy-command 'win32yank.exe -i --crlf' }

# ── Copiar con teclas de Vim ────────────────────────────────────────────────
# Entrar al modo copia: prefijo + [ o arrastrando con el mouse. Salir: q o Esc.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Al soltar el clic copia la selección y se queda en el mismo lugar.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe

# ── Ctrl+h/j/k/l entre paneles de tmux y divisiones de Neovim ───────────────
# La tecla se entrega al programa si es Neovim (él decide), si la ventana tiene
# un solo panel o si el panel está ampliado. En los demás casos cambia de panel,
# sin dar la vuelta al llegar al borde.
%hidden EN_APP='#{||:#{m:*vim*,#{pane_current_command}},#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}}'
bind -n C-h if -F "$EN_APP" { send-keys C-h } { if -F '#{==:#{pane_at_left},0}'   { select-pane -L } }
bind -n C-j if -F "$EN_APP" { send-keys C-j } { if -F '#{==:#{pane_at_bottom},0}' { select-pane -D } }
bind -n C-k if -F "$EN_APP" { send-keys C-k } { if -F '#{==:#{pane_at_top},0}'    { select-pane -U } }
bind -n C-l if -F "$EN_APP" { send-keys C-l } { if -F '#{==:#{pane_at_right},0}'  { select-pane -R } }
# Con varios paneles, la tecla original se envía con el prefijo delante:
bind C-l send-keys C-l        # prefijo + Ctrl+l: limpiar la pantalla
bind C-k send-keys C-k        # prefijo + Ctrl+k: borrar hasta el final de la línea
